[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "imgleakcheck"
version = "0.1.0"
description = "Find duplicate images leaking between train and test sets."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["imagehash", "pillow"]

[project.scripts]
leakcheck = "leakcheck:main"

[tool.setuptools]
py-modules = ["leakcheck"]